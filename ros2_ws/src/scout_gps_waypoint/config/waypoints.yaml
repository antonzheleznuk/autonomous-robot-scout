# ============================================================
# waypoints.yaml — GPS-координаты маршрута Scout Mini
#
# Формат: WGS84 (широта, долгота, высота)
# Привязка: ENU-датум = центр мира Gazebo (spherical_coordinates
#           мира obstacle_course.sdf: 55.755826, 37.617300)
#
# Координаты рассчитаны из позиций в SDF-мире:
#   Старт (A): мир (-7, -7) -> lat 55.755763, lon 37.617189
#   Финиш (B): мир ( 7,  7) -> lat 55.755889, lon 37.617411
#
# Формат файла — параметры ROS 2 (плоские ключи): список
# словарей параметром ноды быть не может (реестр п.34).
# /**: применяется к любой ноде, читающей этот файл.
# yaw задаётся в map-фрейме: 0.0 = ось X (направление A->B).
# ============================================================

/**:
  ros__parameters:
    frame_id: "map"
    # Таймаут всей миссии (5 минут). Если робот не доехал — ошибка.
    timeout_sec: 300.0

    # Датум ENU-проекции = центр мира Gazebo
    datum_latitude: 55.755826
    datum_longitude: 37.617300

    num_waypoints: 2

    # --- Точка 1: Старт (A) ---
    waypoints.0.name: "Старт (A)"
    waypoints.0.latitude: 55.755763
    waypoints.0.longitude: 37.617189
    waypoints.0.altitude: 150.0
    waypoints.0.yaw: 0.0
    # Допуск прибытия (метры): точность GPS ±1 м, допуск меньше
    # физически недостижим — для GPS 1.0 м стандарт.
    waypoints.0.tolerance: 1.0

    # --- Точка 2: Финиш (B) ---
    waypoints.1.name: "Финиш (B)"
    waypoints.1.latitude: 55.755889
    waypoints.1.longitude: 37.617411
    waypoints.1.altitude: 150.0
    waypoints.1.yaw: 0.0
    waypoints.1.tolerance: 1.0
