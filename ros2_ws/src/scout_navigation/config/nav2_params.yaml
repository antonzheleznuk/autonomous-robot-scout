# ============================================================
# nav2_params.yaml — Полная конфигурация навигационного стека Nav2
#
# Серверы: Planner (SmacPlanner2D), Controller (RegulatedPurePursuit),
# Costmap 2D (Global + Local), BT Navigator, Behavior Server,
# Velocity Smoother, Collision Monitor, Waypoint Follower,
# Lifecycle Manager.
#
# Правки под ROS 2 Jazzy (проверены по логам загрузки):
#   - плагины через "::" (nav2_smac_planner::, nav2_behaviors::)
#   - recoveries_server -> behavior_server (behavior_plugins)
#   - plugin_lib_names УДАЛЁН (авто-регистрация BT-плагинов)
#   - BT-деревья по умолчанию заданы явными путями ("" = Empty Tree)
#
# Документация: https://docs.nav2.org/configuration/
# ============================================================

/**:
  ros__parameters:
    use_sim_time: true

# ============================================================
# 1. PLANNER SERVER — Глобальный планировщик (SmacPlanner2D)
# ============================================================
planner_server:
  ros__parameters:


    # Перепланировка раз в 1 с: препятствия статичны, RPP локально
    # объезжает новьё; нагрузка на CPU вдвое ниже
    expected_planner_frequency: 1.0


    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      # Jazzy: разделитель :: (слеш даёт "class does not exist")

      tolerance: 0.25
      # Допуск прибытия (м).

      


      downsample_costmap: false
      downsampling_factor: 1



      allow_unknown: true
      # Планирование через «неизвестное» — карта от SLAM ещё
      # неполная, а inf-лучи не очищают пространство.

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

      cost_travel_multiplier: 2.0
      # >1 = планировщик предпочитает более длинные, но
      # «дешёвые» пути (дальше от препятствий).

      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# ============================================================
# 2. CONTROLLER SERVER — Локальный контроллер
# ============================================================
# RegulatedPurePursuit: следование по пути через точку упреждения
# (carrot). Заменил DWB, который в нашей конфигурации (открытая
# среда, sim-время с джиттером) всегда выбирал vx=0 ("топтание").
# RPP не перебирает траектории — вычисляет команду по кривизне.
# ============================================================
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    # Новая команда скорости каждые 50 мс.

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    # Дифф. привод не ездит боком — vy игнорируем.
    min_theta_velocity_threshold: 0.001

    # --- Прогресс-чекер (детектор застревания) ---
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
      # Меньше 0.5 м за 10 с = «застрял».

    # --- Goal-чекер ---
    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    # --- Контроллер: RegulatedPurePursuit ---
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.4
      # Целевая скорость (м/с) — комфорт при RTF ~0.8

      lookahead_dist: 0.6
      # Базовая дистанция до carrot-точки (м)
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      # Каррот = max(lookahead_dist, v * lookahead_time)

      # Разворот на месте, если путь под большим углом (>45°)
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_min_ang_velocity: 0.4
      max_angular_accel: 3.2
      allow_reversing: false

      # Регулировка скорости: замедление в крутых поворотах
      use_regulated_linear_velocity_scaling: true
      regulated_linear_velocity_min_dist: 0.5
      regulated_linear_velocity_min_scale: 0.25

      # Замедление при приближении к цели
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0

      # Проверка коллизий по costmap вдоль дуги (страховка)
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      # Терпимость к TF: sim-время скачет + SLAM публикует
      # map->odom с джиттером — 0.5 с снимает "extrapolation"
      transform_tolerance: 0.5

      # Поиск ближайшей точки пути к роботу
      max_robot_pose_search_dist: 10.0
      use_velocity_scaled_lookahead_dist: false
      use_interpolation: true

# ============================================================
# 3a. ГЛОБАЛЬНАЯ COSTMAP
# ============================================================
# Ячейки: 0=свободно, 1-252=растущая стоимость,
# 253=inscribed, 254=lethal (препятствие), 255=unknown.
# ============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true

      # НАВАИГАЦИЯ С ОНЛАЙН-SLAM: карта частичная и не покрывает
      # робота на старте (робот вне bounds -> "cannot raytrace").
      # Каноническое решение Nav2: катящееся окно фиксированного
      # размера вокруг робота; static_layer совмещается автоматически.
      rolling_window: true
      width: 40
      height: 40

      # Колея робота 0.44 м, колёса выступают за корпус:
      # описанная окружность = sqrt(0.3^2 + 0.24^2) = 0.384 м.

      # 0.50 (реестр п.42): планировщик считает клетку занятой в
      # кольце = robot_radius (порог INSCRIBED у Smac, см.
      # collision_checker.cpp). 0.40 давало нулевой зазор — план
      # шёл вплотную к кайме, дуга RPP (footprint 0.40 из LOCAL
      # costmap) касалась летальной (LETHAL) каймы -> "collision ahead" со spin.
      # Запас 0.10 м у планировщика; локальная костмапа и
      # физика не изменяются.
      robot_radius: 0.50

      resolution: 0.05
      # Совпадает с SLAM.

      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.12
          obstacle_max_range: 12.0
          obstacle_min_range: 0.12

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0

        # 0.70: широкое кольцо мягких стоимостей (мягкое отталкивание
        # плана от препятствий); жёсткая зона планирования задаётся
        # robot_radius выше (п.42)
        inflation_radius: 0.70
        # > robot_radius (0.50, см. выше) — план держит дистанцию.

# ============================================================
# 3b. ЛОКАЛЬНАЯ COSTMAP
# ============================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      # НЕ map — чтобы не зависеть от коррекций SLAM.

      robot_base_frame: base_footprint
      use_sim_time: true

      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05

      robot_radius: 0.40

      # Открытая среда + inf-лучи: ячейки без препятствий никогда
      # не «очищаются» лучами и остаются NO_INFORMATION. Для
      # ЛОКАЛЬНОГО окна unknown = свободно (иначе контроллеры
      # считали всё впереди «опасным»).
      track_unknown_space: false

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan depth_camera

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
          obstacle_max_range: 10.0
          obstacle_min_range: 0.12

        depth_camera:
          topic: /depth_camera/points
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.4
          obstacle_max_range: 6.0
          obstacle_min_range: 0.4
          min_obstacle_height: 0.05
          # Игнорируем точки ниже 5 см (шум пола).

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

# ============================================================
# 4. BT NAVIGATOR — Поведенческое дерево
# ============================================================
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    # EKF-одометрия.

    bt_loop_duration: 10
    default_server_timeout: 1000

    # Jazzy: пустая строка НЕ подхватывает дерево по умолчанию
    # ("Empty Tree") — задаём пути к штатным деревьям Nav2 явно.
    # (кастомное дерево не понадобилось — миссия на стоковом дереве)
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

    # Коды ошибок BT: параметр error_code_names (массив строк) —
    # см. bt_action_server_impl.hpp; задаём явно стоковые значения,
    # предупреждение "Error_code parameters were not set" уходит
    error_code_names: ["follow_path_error_code", "compute_path_error_code"]

    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    # plugin_lib_names УДАЛЁН: в Jazzy BT-плагины регистрируются
    # автоматически; явный список давал двойную регистрацию
    # ("ID [ComputePathToPose] already registered") и падение.

# ============================================================
# 5. BEHAVIOR SERVER — Поведения восстановления
# ============================================================
# Jazzy: пакет nav2-recoveries влит в nav2-behaviors — секция и
# плагины переименованы (recoveries_server/слеш не работают).
# ============================================================
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 2.0
      simulate_ahead_time: 2.0

    backup:
      plugin: "nav2_behaviors::BackUp"
      simulate_ahead_time: 2.0
      max_linear_vel: 0.3
      min_linear_vel: 0.1
      linear_acc_lim: 1.0

    wait:
      plugin: "nav2_behaviors::Wait"

# ============================================================
# 6. VELOCITY SMOOTHER — Сглаживание скорости
# ============================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    # Согласовано с контроллером (desired 0.4, потолок 0.5)
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ============================================================
# 7. COLLISION MONITOR — Экстренная остановка
# ============================================================
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 5.0
    base_shift_correction: true

    polygons: ["PolygonStop"]
    PolygonStop:
      type: "circle"
      # Радиус подобран под описанную окружность робота (0.384 м):
      # при меньшем (0.30) препятствие касалось бы корпуса раньше
      # срабатывания стопа.
      radius: 0.45
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_freq: 1.0

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 2.0

# ============================================================
# 8. WAYPOINT FOLLOWER
# ============================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0

    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

# ============================================================
# 9. LIFECYCLE MANAGER
# ============================================================
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [
      "planner_server",
      "controller_server",
      "behavior_server",
      # Jazzy: было recoveries_server
      "bt_navigator",
      "waypoint_follower",
      "velocity_smoother",
      "collision_monitor"
    ]
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0
